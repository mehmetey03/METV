name: Update List

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run script
        run: |
          python tv.py

      - name: Check generated file
        run: |
          echo "mahsun.m3u kontrol ediliyor..."
          if [ ! -f "mahsun.m3u" ]; then
            echo "HATA: mahsun.m3u oluşturulamadı!"
            exit 1
          fi

          echo "Dosya boyutu:"
          ls -lh mahsun.m3u

          echo "Kanal sayısı:"
          grep -c "#EXTINF" mahsun.m3u || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mahsun.m3u

          if git diff --cached --quiet; then
            echo "Değişiklik yok. Push yapılmayacak."
            exit 0
          fi

          git commit -m "Liste Güncellendi"

          git push origin HEAD:${{ github.ref_name }}
